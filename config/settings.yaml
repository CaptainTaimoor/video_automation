app:
  timezone: Asia/Karachi
  min_duration_seconds: 30
  max_duration_seconds: 60
  image_count_per_video: 12
  output_root: output
  music_dir: assets/music
  state_dir: data/state
  topic_cache_dir: data/topics
  script_writer:
    # Legitimate no-cost routing: Gemini first, then Groq when GROQ_API_KEY is
    # set, then the Hugging Face OpenAI-compatible gateway, then local Ollama.
    # Prefer qwen2.5:7b for Ollama full scripts; never rely on llama3.2:3b for
    # narration drafts. No provider tokens are stored in this file.
    provider: routed
    # OpenRouter leads because it is the only one that is actually available.
    # Gemini's free quota lets roughly one call through and then answers 429
    # for the rest of the day, and with it first every run spent its first
    # call discovering that, then put the whole chain on cooldown. It stays in
    # the order as a second opinion, not as the default.
    provider_order:
      - openai_compatible
      - gemini
      - groq
      - ollama
    # Long enough to stop hammering a provider that is genuinely down, short
    # enough that a nine-model ladder is not sidelined by one bad minute.
    provider_cooldown_seconds: 90
    gemini_model: gemini-2.5-flash-lite
    gemini_url: https://generativelanguage.googleapis.com/v1beta/models
    ollama_model: qwen2.5:7b
    ollama_url: http://localhost:11434/api/generate
    # Leave enough time for a cold local-model start, while keeping the final
    # fallback bounded so an unavailable daemon cannot stall a build forever.
    ollama_timeout_seconds: 90
    # Account catalog (Sep 2026): llama-3.3-70b-versatile is not on this key.
    # Prefer gpt-oss-120b for narration; gpt-oss-20b is the fast shorts alternate.
    groq_model: openai/gpt-oss-120b
    groq_url: https://api.groq.com/openai/v1
    groq_api_key_env: GROQ_API_KEY
    # If Groq returns model_not_found, list models with the same key and update
    # groq_model. Free-tier RPD is per-model; cooldown will fall through to HF.
    mistral_model: mistral-small-latest
    mistral_url: https://api.mistral.ai/v1
    mistral_api_key_env: MISTRAL_API_KEY
    # Legitimate free-tier fallback already available in this workspace. Set
    # AI_GATEWAY_URL, AI_GATEWAY_MODEL, and AI_GATEWAY_API_KEY together to use
    # a separate authorized profile without sending HF_API_KEY to another host.
    # OpenRouter's free tier. The account's credit is not spent: it only
    # raises the free daily request limit. The Hugging Face router answered
    # 402 on every call, which is why this moved.
    openai_compatible_url: https://openrouter.ai/api
    openai_compatible_model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    # Tried in turn when the one above is busy. Every entry was checked on
    # 2026-09-21 against the real beat-rewrite task and returned the exact
    # beat count asked for.
    #
    # The ladder held six and three of them were answering 429, 400 or timing
    # out, so the whole provider looked dead while OpenRouter had twenty-four
    # free models on offer. Half of anything free is rate-limited at any
    # moment; the answer is more rungs, not better luck.
    #
    # openrouter/free is last on purpose. It is a router and it can land on
    # nvidia/nemotron-3.5-content-safety, which replies "User Safety: safe"
    # and nothing else -- the mystery answer that cost an earlier run its
    # scripts.
    openai_compatible_models:
      # Ordered by what answered the real rewrite prompt, and how dearly.
      # nano-omni did it in 180 tokens; the next two needed 3147 and 3749.
      - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      - nvidia/nemotron-3-ultra-550b-a55b:free
      - nex-agi/nex-n2.5-pro:free
      - nvidia/nemotron-3-super-120b-a12b:free
      - inclusionai/ling-3.0-flash-vl:free
      # These three answered a short prompt and return nothing at all on the
      # real one, spending the whole budget on thinking. Kept last as a
      # lottery ticket rather than removed: free models come back.
      - liquid/lfm-2.5-2.6b:free
      - inclusionai/ling-3.0-flash-fin:free
      - nex-agi/nex-n2.5-mini:free
      - openrouter/free
    openai_compatible_api_key_env: OPENROUTER_API_KEY
    openai_compatible_allowed_hosts:
      - openrouter.ai
      - router.huggingface.co
      - api.groq.com
      - api.mistral.ai
    openai_compatible_timeout_seconds: 90
    openai_compatible_disable_thinking: true
    timeout_seconds: 90
  visuals:
    # How long one scene may spend finding and downloading footage. A clip can
    # take 30-60s on a slow line and a Short needs about six, so too small a
    # budget makes the scene give up and use a generated card instead.
    scene_deadline_seconds: 110
    # Ceiling for all of a Short's scenes together.
    fetch_deadline_seconds: 420
    # Searches run together rather than one after another; this caps how many
    # at once, so a burst does not get us rate-limited.
    search_workers: 4
    # How many pages of stock results to read. Page one is the most popular
    # clips, which the anti-repeat rules mostly discard.
    stock_pages: 3
    # Verified footage is kept here and reused instead of re-downloaded.
    library_enabled: true
    library_max_gb: 8
  subtitles:
    enabled: true
    max_words_per_caption: 4
  thumbnail:
    enabled: true
    width: 1080
    height: 1920
  ab_test_enabled: true
  ab_test_variants: 3
  feedback_enabled: true
  feedback_min_views: 100
  feedback_lookback_days: 30
  candidate_pool_size: 4
  schedule_interval_hours: 2
  schedule_uploads: true
  # The upload-continuity monitor checks both channels this often. It only
  # schedules a recovery Short when the successful-upload gap exceeds the
  # per-channel threshold, and it still obeys upload blocks and daily caps.
  upload_gap_check_minutes: 10

channels:
  - id: ancient_history
    display_name: "Secrets of Time"
    niche_description: "Ancient history, empires, mysteries, wars, rulers, archaeology"
    seed_keywords:
      - "ancient history"
      - "roman empire"
      - "egyptian civilization"
      - "lost cities"
      - "historical mysteries"
    styles:
      - listicle
      - story
      - motivational
    # Phase C (best-time trim): keep top hours from performance-report.
    # Winners: 21, 19, 15, 07, 00, 18, 10 (+ a few near-winner probes).
    schedule_times:
      - "00:20"
      - "07:10"
      - "08:10"
      - "10:10"
      - "12:10"
      - "15:10"
      - "16:10"
      - "18:10"
      - "19:10"
      - "20:10"
      - "21:10"
      - "22:10"
    content_profiles:
      shorts:
        # Videos per day: a count is drawn inside this range each day and
        # placed on the channel's best-performing hours.
        daily_min: 10
        daily_max: 12
        enabled: true
        schedule_times:
          - "00:20"
          - "07:10"
          - "08:10"
          - "10:10"
          - "12:10"
          - "15:10"
          - "16:10"
          - "18:10"
          - "19:10"
          - "20:10"
          - "21:10"
          - "22:10"
        min_duration_seconds: 50
        max_duration_seconds: 59
        target_width: 1080
        target_height: 1920
      videos:
        # Videos per day: a count is drawn inside this range each day and
        # placed on the channel's best-performing hours.
        daily_min: 6
        daily_max: 8
        enabled: true
        # Longs aligned to strong hours (still 6/day within 5–8 target).
        schedule_times:
          - "07:30"
          - "10:30"
          - "15:30"
          - "18:30"
          - "19:30"
          - "21:30"
        # 4-6 minutes. The script budget follows these numbers, so changing
        # them changes the script length too; a fixed word floor used to
        # override this and force nine minutes regardless.
        min_duration_seconds: 240
        max_duration_seconds: 360
        target_width: 1920
        target_height: 1080
        # Slower than the Shorts read below, because speaking rate and the
        # 17 CPS caption gate are one setting seen from two sides. At 1.10
        # this channel's vocabulary puts 18.4 characters a second on screen,
        # which needs 8.52% narration stretch against an 8.5% ceiling -- three
        # long builds in a row died on that. Measured on the same beat:
        # 1.10 -> +8.52% (fails), 1.05 -> +5.48%, 1.00 -> +2.42%.
        voice_speed: 1.0
    voice_mode: single
    tts_backend: kokoro
    voices:
      - kokoro-bm_george@1.10
    visual_style: documentary
    viral_dna_channels:
      - https://www.youtube.com/@HistoryMarche
      - https://www.youtube.com/@VoicesofthePast
      - https://www.youtube.com/@Toldinstone
      - https://www.youtube.com/@HistoryMatters
    hashtags:
      - "#history"
      - "#ancienthistory"
      - "#historicalfacts"
      - "#historicalmysteries"
      - "#secretssoftime"
      - "#archeology"
      - "#discovery"
      - "#mythology"
      - "#worldhistory"
      - "#civilization"
      - "#ancientcivilizations"
    output_dir: output/ancient_history
    daily_upload_cap: 18
    max_upload_gap_hours: 3.0
    upload_gap_retry_cooldown_minutes: 20
    short_build_timeout_minutes: 45
    video_build_timeout_minutes: 90
    short_build_stall_minutes: 12
    video_build_stall_minutes: 25
    schedule_interval_hours: 1
    backlog_schedule_interval_minutes: 60
    youtube:
      upload_enabled: true
      client_secrets_file: client_secrets.json
      token_file: secrets/tokens/ancient_history_token.json
      privacy_status: public

    facebook:
      upload_enabled: false
      page_id: "101382192681601"
      access_token_env_var: "FB_PAGE_TOKEN_ANCIENT_HISTORY"

    monetization:
      enabled: true
      long_form_cta: "Watch our longer documentaries on this channel for maps, sources, and the full evidence trail."
      long_form_playlist_url: ""
      pinned_comment_template: "Full documentary-style videos are on this channel. {title}"
      affiliates:
        - label: "Recommended history book"
          url_env: "AFFILIATE_ANCIENT_BOOK_URL"
        - label: "History tool / course pick"
          url_env: "AFFILIATE_ANCIENT_TOOL_URL"

