app:
  timezone: Asia/Karachi
  min_duration_seconds: 30
  max_duration_seconds: 60
  image_count_per_video: 12
  output_root: output
  music_dir: assets/music
  state_dir: data/state
  topic_cache_dir: data/topics
  script_writer:
    # Legitimate no-cost routing: the configured Gemini key first, then an
    # optional OpenAI-compatible gateway, then the local Ollama installation.
    # No provider tokens are stored in this file.
    provider: routed
    provider_order:
      - gemini
      - openai_compatible
      - ollama
    provider_cooldown_seconds: 180
    gemini_model: gemini-2.5-flash-lite
    gemini_url: https://generativelanguage.googleapis.com/v1beta/models
    ollama_model: llama3.2:3b
    ollama_url: http://localhost:11434/api/generate
    # Leave enough time for a cold local-model start, while keeping the final
    # fallback bounded so an unavailable daemon cannot stall a build forever.
    ollama_timeout_seconds: 90
    # Legitimate free-tier fallback already available in this workspace. Set
    # AI_GATEWAY_URL, AI_GATEWAY_MODEL, and AI_GATEWAY_API_KEY together to use
    # a separate authorized profile without sending HF_API_KEY to another host.
    openai_compatible_url: https://router.huggingface.co
    openai_compatible_model: Qwen/Qwen3-8B
    openai_compatible_api_key_env: HF_API_KEY
    openai_compatible_allowed_hosts:
      - router.huggingface.co
    openai_compatible_timeout_seconds: 90
    openai_compatible_disable_thinking: true
    timeout_seconds: 90
  subtitles:
    enabled: true
    max_words_per_caption: 4
  thumbnail:
    enabled: true
    width: 1080
    height: 1920
  ab_test_enabled: true
  ab_test_variants: 3
  feedback_enabled: true
  feedback_min_views: 100
  feedback_lookback_days: 30
  candidate_pool_size: 4
  schedule_interval_hours: 2
  schedule_uploads: true
  # The upload-continuity monitor checks both channels this often. It only
  # schedules a recovery Short when the successful-upload gap exceeds the
  # per-channel threshold, and it still obeys upload blocks and daily caps.
  upload_gap_check_minutes: 10

channels:
  - id: ancient_history
    display_name: "Secrets of Time"
    niche_description: "Ancient history, empires, mysteries, wars, rulers, archaeology"
    seed_keywords:
      - "ancient history"
      - "roman empire"
      - "egyptian civilization"
      - "lost cities"
      - "historical mysteries"
    styles:
      - listicle
      - story
      - motivational
